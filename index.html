<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#140810">
  <meta name="description" content="Visual prototype of the Two-Thirds elimination arena. Fake players. Not a real game.">
  <title>Two-Thirds — Visual Prototype</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23ff3b7a' width='16' height='16'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./css/styles.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app" data-phase="boot">
    <canvas id="view" aria-hidden="true"></canvas>
    <div class="overlay">
      <header class="banner panel hud">
        <div class="brand-row">
          <div class="brand">
            <span class="mark" aria-hidden="true">2/3</span>
            <div>
              <h1 class="title">TWO-THIRDS</h1>
              <div class="mode">Elimination match</div>
            </div>
          </div>
          <div class="timer" id="timer">2.4</div>
        </div>
        <div class="phase-row">
          <div class="phase" id="phase-label">Announce</div>
          <div class="round" id="round-label">Round 1</div>
        </div>
        <p class="sub" id="phase-sub">Window 0–100</p>
        <p class="detail" id="phase-detail">Target · 2/3 of the average</p>
        <p class="pace">Accelerated preview pacing</p>
        <div class="pips" id="pips" aria-hidden="true"></div>
        <div class="track" aria-hidden="true"><span id="phase-bar"></span></div>
      </header>

      <div class="mid">
        <p class="note hud">Visual prototype. Fake players. Not a real game.</p>
        <div class="quick">
          <button id="speed" class="action hud" type="button" aria-pressed="false">1×</button>
          <button id="clip" class="action" type="button" aria-pressed="false">Clip View</button>
        </div>
      </div>

      <div class="spacer"></div>

      <section class="chart panel" id="chart" hidden></section>

      <div class="bottom-row hud">
        <section class="controls panel" aria-label="Arena size">
          <div class="control-top">
            <label for="roster">Players <strong id="roster-n">24</strong></label>
            <p class="radius-line">Radius <strong id="radius-value">18.25</strong></p>
          </div>
          <input id="roster" type="range" min="4" max="100" step="1" value="24" aria-label="Player count">
          <p class="formula">r = 6 + 2.5√N</p>
          <p class="alive" id="alive-line">24 alive · One ring</p>
        </section>

        <section class="dial panel" id="dial" aria-label="Your number">
          <div class="dial-top">
            <span>YOU · 001</span>
            <span class="lock-state" id="lock-state">Open</span>
          </div>
          <div class="dial-row">
            <button id="minus" type="button" aria-label="Lower number">−</button>
            <output id="pick-value" for="minus plus">033</output>
            <button id="plus" type="button" aria-label="Raise number">+</button>
            <button id="lock" type="button">Lock</button>
          </div>
        </section>
      </div>
    </div>

    <div class="winner" id="winner" hidden>
      <p class="kicker" id="winner-kicker">Winner</p>
      <p id="winner-name">001</p>
    </div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
